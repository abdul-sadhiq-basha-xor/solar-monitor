apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-dags
  namespace: airflow
data:
  k8s_simulate_readings.py: |
    from datetime import datetime
    from airflow import DAG
    from airflow.providers.cncf.kubernetes.operators.pod import KubernetesPodOperator
    from kubernetes.client import models as k8s

    with DAG(
        dag_id="k8s_simulate_solar_readings",
        description="Run k8s_simulate_solar_readings in a Kubernetes pod every minute",
        schedule_interval="* * * * *",
        start_date=datetime(2024, 1, 1),
        catchup=False,
        tags=["k8s", "readings"],
    ) as dag:

        simulate_readings = KubernetesPodOperator(
            task_id="simulate_solar_readings",
            name="simulate-solar-readings",
            namespace="airflow",
            image="solar-monitor-airflow:latest",
            image_pull_policy="Never",
            cmds=["python", "-c"],
            arguments=[
                "import django, os\n"
                "os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'solar_monitor.settings')\n"
                "django.setup()\n"
                "from plants.tasks import k8s_simulate_solar_readings\n"
                "count = k8s_simulate_solar_readings()\n"
                "print(f'[K8s] Done - {count} readings written')\n"
            ],
            env_vars=[
                k8s.V1EnvVar(name="DJANGO_SETTINGS_MODULE", value="solar_monitor.settings"),
                k8s.V1EnvVar(name="PYTHONPATH",             value="/opt/airflow/solar_monitor"),
                k8s.V1EnvVar(name="DB_HOST",                value="postgres.airflow.svc.cluster.local"),
                k8s.V1EnvVar(name="DB_NAME",                value="solar_monitor"),
                k8s.V1EnvVar(name="DB_USER",                value="solar_user"),
                k8s.V1EnvVar(name="DB_PASSWORD",            value="password"),
                k8s.V1EnvVar(name="DB_PORT",                value="5432"),
            ],
            container_resources=k8s.V1ResourceRequirements(
                requests={"cpu": "100m", "memory": "256Mi"},
                limits={"cpu": "500m", "memory": "512Mi"},
            ),
            is_delete_operator_pod=False,
            get_logs=True,
            do_xcom_push=False,
        )
