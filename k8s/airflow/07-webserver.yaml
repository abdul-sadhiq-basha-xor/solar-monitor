# 07-webserver.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      serviceAccountName: airflow
      initContainers:
        - name: copy-dags
          image: busybox
          command:
            - sh
            - -c
            - cp /configmap-dags/*.py /dags/
          volumeMounts:
            - name: configmap-dags
              mountPath: /configmap-dags
            - name: dags
              mountPath: /dags
      containers:
        - name: webserver
          image: solar-monitor-airflow:latest
          imagePullPolicy: Never
          args: ["airflow", "webserver"]
          envFrom:
            - configMapRef:
                name: airflow-env
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
      volumes:
        - name: configmap-dags
          configMap:
            name: airflow-dags
        - name: dags
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: airflow
spec:
  type: NodePort
  selector:
    app: airflow-webserver
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081