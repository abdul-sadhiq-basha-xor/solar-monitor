# 06-scheduler.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      serviceAccountName: airflow
      initContainers:
        - name: copy-dags
          image: busybox
          command:
            - sh
            - -c
            - cp /configmap-dags/*.py /dags/
          volumeMounts:
            - name: configmap-dags
              mountPath: /configmap-dags
            - name: dags
              mountPath: /dags
      containers:
        - name: scheduler
          image: solar-monitor-airflow:latest
          imagePullPolicy: Never
          args: ["airflow", "scheduler"]
          envFrom:
            - configMapRef:
                name: airflow-env
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
      volumes:
        - name: configmap-dags
          configMap:
            name: airflow-dags
        - name: dags
          emptyDir: {}