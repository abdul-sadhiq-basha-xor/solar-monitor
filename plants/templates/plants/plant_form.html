<!DOCTYPE html>
<html>
<head>
    <title>{% if plant %}Edit{% else %}Add{% endif %} Plant</title>
</head>

    </form>
    <p><a href="{% url 'dashboard' %}">Back to dashboard</a></p>
</body>
</html>
